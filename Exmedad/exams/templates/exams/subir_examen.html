<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Subir Examen - ExMedAd</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
    <div class="container my-5" style="max-width: 700px;">
        <div class="card p-4 shadow-lg border-2 rounded-4">
            <h1 class="fw-bold text-primary mb-3 text-center">📄 Analizar Nuevo Examen</h1>
            <p class="fs-4 text-secondary text-center mb-4">Sube el archivo PDF de tus exámenes médicos para interpretarlos fácilmente.</p>
            
            <form method="POST" enctype="multipart/form-data">
                {% csrf_token %}
                <div class="mb-4">
                    <label for="archivo_pdf" class="form-label fs-4 fw-bold">Selecciona el archivo PDF:</label>
                    <input class="form-control form-control-lg border-2" type="file" id="archivo_pdf" name="archivo_pdf" accept=".pdf" required style="font-size: 1.2rem;">
                </div>
                <button type="submit" class="btn btn-primary btn-lg w-100 fw-bold py-3 fs-3 shadow">🔍 Analizar Mi Examen</button>
            </form>
            
            <div class="text-center mt-4">
                <a href="{% url 'historial_examenes' %}" class="fs-4 text-decoration-none">Ver Historial de Exámenes ➔</a>
            </div>
        </div>
    </div>
</body>
</html>
