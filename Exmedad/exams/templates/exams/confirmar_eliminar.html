<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Eliminar Examen - ExMedAd</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
    {% include 'core/navbar.html' %}

    <div class="container my-5" style="max-width: 700px;">
        <div class="card p-4 border-2 rounded-0">
            <h1 class="fw-bold text-danger display-6">¿Eliminar este examen?</h1>
            <p class="fs-4 mb-1"><strong>{{ examen.titulo }}</strong></p>
            <p class="text-muted fs-5">Registrado el: {{ examen.fecha|date:"d/m/Y H:i" }}</p>
            <p class="fs-5">Esta acción no se puede deshacer.</p>

            <form method="post" class="d-flex flex-wrap gap-3 mt-3">
                {% csrf_token %}
                <button type="submit" class="btn btn-danger btn-lg fw-bold fs-4 rounded-0">Sí, eliminar</button>
                <a href="{% url 'historial_examenes' %}" class="btn btn-outline-secondary btn-lg fw-bold fs-4 rounded-0">No, volver</a>
            </form>
        </div>
    </div>
</body>
</html>
