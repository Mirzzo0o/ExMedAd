<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ExMedAd - Inicio</title>
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background-color: #f8f9fa;
            color: #212529;
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .container {
            max-width: 800px;
            width: 100%;
            padding: 40px 20px;
            text-align: center;
        }

        h1 {
            color: #0d6efd;
            font-size: 2.8rem;
            margin-top: 0;
            margin-bottom: 20px;
            line-height: 1.2;
        }

        p {
            font-size: 1.4rem;
            color: #6c757d;
            margin-bottom: 40px;
            line-height: 1.5;
        }

        .button-group {
            display: flex;
            justify-content: center;
            gap: 20px;
            flex-wrap: wrap;
        }

        .btn {
            display: inline-block;
            padding: 15px 30px;
            font-family: inherit;
            font-size: 1.25rem;
            font-weight: bold;
            text-decoration: none;
            border-radius: 0;
            border: 2px solid transparent;
            cursor: pointer;
            transition: background-color 0.2s, color 0.2s;
        }

        .btn-success {
            background-color: #198754;
            color: #ffffff;
            border-color: #198754;
        }

        .btn-success:hover {
            background-color: #157347;
            border-color: #146c43;
        }

        .btn-outline-secondary {
            background-color: transparent;
            color: #6c757d;
            border-color: #6c757d;
        }

        .btn-outline-secondary:hover {
            background-color: #6c757d;
            color: #ffffff;
        }

        .logout-form {
            margin-top: 40px;
        }

        .btn-link {
            background: none;
            border: none;
            color: #6c757d;
            font-family: inherit;
            font-size: 1.1rem;
            text-decoration: underline;
            cursor: pointer;
        }

        .btn-link:hover {
            color: #212529;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>Bienvenido a ExMedAd, tu asistente médico de confianza</h1>
        <p>Te ayudaré a comprender tus exámenes de forma fácil, clara y segura.</p>

        <div class="button-group">
            <a href="{% url 'subir_examen' %}" class="btn btn-success">Revisar mi Examen</a>
            <a href="{% url 'asistente_chat' %}" class="btn btn-outline-secondary">Hablar con el Asistente</a>
        </div>

        <form method="post" action="{% url 'logout' %}" class="logout-form">
            {% csrf_token %}
            <button type="submit" class="btn-link">Cerrar sesión</button>
        </form>
    </div>

</body>
</html>
