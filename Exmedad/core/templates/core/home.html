<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ExMedAd - Inicio</title>
    <style>
        /* Estilos generales limpios y minimalistas */
        body {
            font-family: Arial, sans-serif;
            background-color: #f8f9fa;
            color: #212529;
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .container {
            max-width: 800px;
            width: 100%;
            padding: 40px 20px;
            text-align: center;
        }

        /* Tipografía principal */
        h1 {
            color: #0d6efd;
            font-size: 2.8rem;
            margin-top: 0;
            margin-bottom: 20px;
            line-height: 1.2;
            font-weight: bold;
        }

        p {
            font-size: 1.4rem;
            color: #6c757d;
            margin-bottom: 40px;
            line-height: 1.5;
        }

        /* Contenedor de botones alineados */
        .button-group {
            display: flex;
            justify-content: center;
            gap: 20px;
            flex-wrap: wrap;
        }

        /* Estilo base para los botones (rectangulares, sin sombras) */
        .btn {
            display: inline-block;
            padding: 15px 30px;
            font-size: 1.25rem;
            font-weight: bold;
            text-decoration: none;
            border-radius: 0;
            border: 2px solid transparent;
            cursor: pointer;
            transition: background-color 0.2s, color 0.2s;
        }

        /* Botón primario (verde para acción principal) */
        .btn-success {
            background-color: #198754;
            color: #ffffff;
            border-color: #198754;
        }

        .btn-success:hover {
            background-color: #157347;
            border-color: #146c43;
        }

        /* Botón secundario (contorno gris) */
        .btn-outline-secondary {
            background-color: transparent;
            color: #6c757d;
            border-color: #6c757d;
        }

        .btn-outline-secondary:hover {
            background-color: #6c757d;
            color: #ffffff;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>Bienvenido a ExMedAd, Tu Asistente Médico de confianza</h1>
        <p>Te ayudare a comprender tus exámenes de forma fácil, clara y segura.</p>

        <div class="button-group">
            <a href="{% url 'subir_examen' %}" class="btn btn-success">Revisar mi Examen</a>
            <a href="{% url 'ver_asistente' %}" class="btn btn-outline-secondary">Hablar con el Asistente</a>
        </div>
    </div>

</body>
</html>
